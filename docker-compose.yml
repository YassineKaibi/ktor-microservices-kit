services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      AUTH_DB: ${AUTH_DB:-auth_db}
      USER_DB: ${USER_DB:-user_db}
      CRUD_DB: ${CRUD_DB:-crud_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB:-auth_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
      JWT_ISSUER: ${JWT_ISSUER:-ktor-microservices-kit}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build:
      context: ./services/user-service
    environment:
      PORT: 8082
      REPO_BACKEND: ${REPO_BACKEND:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${USER_DB:-user_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  crud-service:
    build:
      context: ./services/crud-service
    environment:
      PORT: 8083
      REPO_BACKEND: ${REPO_BACKEND:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${CRUD_DB:-crud_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - auth-service
      - user-service
      - crud-service

volumes:
  pgdata:
