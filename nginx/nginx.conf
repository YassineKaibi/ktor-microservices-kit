worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Structured JSON logging to stdout
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    # Rate limiting zone (shared memory, 30 requests/sec per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream auth_service {
        server auth-service:8081;
    }

    upstream user_service {
        server user-service:8082;
    }

    upstream crud_service {
        server crud-service:8083;
    }

    server {
        listen 8080;

        # Apply rate limiting globally
        limit_req zone=api_limit burst=50 nodelay;

        # --- Gateway health ---
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # --- Health & readiness checks (bypass auth) ---
        location = /auth/health {
            proxy_pass http://auth_service;
        }

        location = /auth/ready {
            proxy_pass http://auth_service;
        }

        location = /users/health {
            proxy_pass http://user_service;
        }

        location = /users/ready {
            proxy_pass http://user_service;
        }

        location = /items/health {
            proxy_pass http://crud_service;
        }

        location = /items/ready {
            proxy_pass http://crud_service;
        }

        # --- Internal auth validation subrequest ---
        location = /auth/validate {
            internal;
            proxy_pass              http://auth_service;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
        }

        # --- Public routes (no auth required) ---
        location /auth/ {
            proxy_pass http://auth_service;
        }

        # --- Protected routes ---
        location /users/ {
            auth_request     /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_set_header X-User-Id $user_id;
            proxy_pass http://user_service;
        }

        # Prefix (no trailing slash) so the bare collection path /items is also matched,
        # not just /items/<id>. The exact /items/health and /items/ready locations above
        # take precedence over this prefix.
        location /items {
            auth_request     /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_set_header X-User-Id $user_id;
            proxy_pass http://crud_service;
        }
    }
}
