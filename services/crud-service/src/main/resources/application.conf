ktor {
    deployment {
        port = 8083
        port = ${?PORT}
    }
    application {
        modules = [ com.starter.crud.ApplicationKt.module ]
    }
}

repository {
    # postgres (default) or memory. memory needs no external datastore.
    backend = "postgres"
    backend = ${?REPO_BACKEND}
}

database {
    host = "localhost"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    name = "crud_db"
    name = ${?DB_NAME}
    user = "postgres"
    user = ${?DB_USER}
    password = "postgres"
    password = ${?DB_PASSWORD}
}
