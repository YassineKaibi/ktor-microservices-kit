ktor {
    deployment {
        port = 8081
        port = ${?PORT}
    }
    application {
        modules = [ com.starter.auth.ApplicationKt.module ]
    }
}

jwt {
    secret = "change-me-to-a-random-secret"
    secret = ${?JWT_SECRET}
    issuer = "ktor-microservices-kit"
    issuer = ${?JWT_ISSUER}
    accessExpirationMs = 3600000
    accessExpirationMs = ${?JWT_EXPIRATION_MS}
    refreshExpirationMs = 604800000
    refreshExpirationMs = ${?JWT_REFRESH_EXPIRATION_MS}
}

auth {
    bcryptCost = 12
    bcryptCost = ${?BCRYPT_COST}
}

database {
    host = "localhost"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    name = "auth_db"
    name = ${?DB_NAME}
    user = "postgres"
    user = ${?DB_USER}
    password = "postgres"
    password = ${?DB_PASSWORD}
}

redis {
    host = "localhost"
    host = ${?REDIS_HOST}
    port = 6379
    port = ${?REDIS_PORT}
}
